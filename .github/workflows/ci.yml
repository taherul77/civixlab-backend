name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: civixlab
          POSTGRES_USER: civixlab
          POSTGRES_PASSWORD: civixlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civixlab -d civixlab"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://civixlab:civixlab@localhost:5432/civixlab?schema=public
      DIRECT_DATABASE_URL: postgresql://civixlab:civixlab@localhost:5432/civixlab?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx prisma migrate deploy
